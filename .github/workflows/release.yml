name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: KLineReview-win64
          - os: macos-15-intel
            artifact: KLineReview-mac-x64
          - os: macos-14
            artifact: KLineReview-mac-arm64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'manual' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate app icons
        run: python packaging/make_icons.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/KLineReview.spec

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item dist/KLineReview.exe "dist/${{ matrix.artifact }}-${{ env.VERSION }}.exe"

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create \
            -volname KLineReview \
            -srcfolder dist/KLineReview.app \
            -ov -format UDZO \
            "dist/${{ matrix.artifact }}-${{ env.VERSION }}.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}-${{ env.VERSION }}
          path: |
            dist/${{ matrix.artifact }}-${{ env.VERSION }}.exe
            dist/${{ matrix.artifact }}-${{ env.VERSION }}.dmg
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/${{ matrix.artifact }}-${{ env.VERSION }}.exe
            dist/${{ matrix.artifact }}-${{ env.VERSION }}.dmg
          generate_release_notes: true
